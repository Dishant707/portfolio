<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dishant Patidar — Desert Cinematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; }
  #hud {
    position:absolute; top:12px; left:12px; color:rgba(255,255,255,.7);
    font:12px/1.6 "Plus Jakarta Sans", -apple-system, sans-serif;
    background:rgba(0,0,0,.35); padding:8px 12px; border-radius:8px;
    user-select:none; pointer-events:none; backdrop-filter:blur(4px);
  }
  #toggleBtn {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    pointer-events:auto; cursor:pointer;
    font:500 14px "Plus Jakarta Sans", sans-serif; color:rgba(255,255,255,.85);
    background:rgba(30,25,18,.65); border:1px solid rgba(245,190,120,.3);
    padding:10px 20px; border-radius:999px; backdrop-filter:blur(8px);
    letter-spacing:.2px;
  }
  #toggleBtn:hover { background:rgba(70,55,35,.75); border-color:rgba(245,190,120,.5); }
  #title {
    position:absolute; left:7%; top:50%;
    color:#fff; font-family:"Plus Jakarta Sans", sans-serif;
    text-align:left; max-width:46%; pointer-events:none;
    animation:sandBlow 12s cubic-bezier(.22,.61,.36,1) infinite;
  }
  #title .name {
    font-family:"Playfair Display", Georgia, serif;
    font-size:clamp(40px, 6.5vw, 92px); font-weight:600; line-height:1.06; letter-spacing:-1px;
    background:linear-gradient(180deg, #f9e2b6 0%, #e8b87d 48%, #c98a4e 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 18px rgba(120,60,20,.4));
  }
  #title .info {
    font-size:clamp(14px, 1.8vw, 20px); margin-top:16px; font-weight:300;
    color:rgba(240,215,175,.82); letter-spacing:.4px;
    text-shadow:0 1px 12px rgba(80,40,10,.5);
  }
  @keyframes sandBlow {
    0%   { opacity:0; filter:blur(16px); transform:translate(80px, -50%) skewX(-12deg); }
    14%  { opacity:1; filter:blur(0);    transform:translate(0, -50%) skewX(0); }
    68%  { opacity:1; filter:blur(0);    transform:translate(0, -52%) skewX(0); }
    100% { opacity:0; filter:blur(18px); transform:translate(-90px, -50%) skewX(10deg); }
  }
</style>
</head>
<body>
<div id="title">
  <div class="name">Dishant Patidar</div>
  <div class="info">Researcher &amp; Bioinformatologist · Space, Data &amp; Biology</div>
</div>
<button id="toggleBtn">🎥 Fly-through (auto)</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------- config ----------------
const SIZE = 400, RES = 240, HEIGHT = 18;
const PLATEAU = 0.8;                 // flat platform height where pyramids sit

// ---------------- deterministic noise ----------------
function hash2(ix, iz) {
  let n = (ix * 374761393 + iz * 668265263) >>> 0;
  n = ((n ^ (n >> 13)) * 1274126177) >>> 0;
  n = n ^ (n >> 16);
  return (n & 0x7fffffff) / 0x7fffffff;
}
const smooth = t => t * t * (3 - 2 * t);
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const a = hash2(ix, iz), b = hash2(ix + 1, iz);
  const c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  const ux = smooth(fx), uz = smooth(fz);
  return a * (1 - ux) * (1 - uz) + b * ux * (1 - uz) + c * (1 - ux) * uz + d * ux * uz;
}
function fbm(x, z, oct = 4) {
  let v = 0, amp = 1, freq = 1, tot = 0;
  for (let i = 0; i < oct; i++) { v += amp * vnoise(x * freq, z * freq); tot += amp; amp *= 0.5; freq *= 2; }
  return v / tot;
}
const clamp01 = x => Math.min(1, Math.max(0, x));
const smoothstep = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

// ---------------- scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd3a174, 130, 520);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(26, 28, -120);

const LOOK = new THREE.Vector3(26, 14, 0);  // revolve around the pyramid
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(LOOK);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 8;
controls.maxDistance = 500;

// ---------------- post-processing (bloom + vignette + film output) ----------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.45, 0.85);
composer.addPass(bloomPass);

const vignettePass = new ShaderPass(VignetteShader);
vignettePass.uniforms['offset'].value = 0.92;
vignettePass.uniforms['darkness'].value = 1.4;
composer.addPass(vignettePass);

composer.addPass(new OutputPass());

// ---------------- fallback procedural sky (used if HDRI missing) ----------------
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 15),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vPos;
      void main(){
        vec3 d = normalize(vPos);
        float h = clamp(d.y, 0.0, 1.0);
        vec3 top = vec3(0.76, 0.40, 0.18);      // deep amber-orange
        vec3 horizon = vec3(0.98, 0.80, 0.58);  // pale warm sand
        vec3 col = mix(horizon, top, pow(h, 0.75));
        float s = max(dot(d, normalize(vec3(0.2, 0.32, 0.6))), 0.0);
        col += vec3(1.0, 0.85, 0.55) * pow(s, 140.0) * 0.8;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(skyDome);

// ---------------- lights ----------------
const hemi = new THREE.HemisphereLight(0xd7b777, 0xa76737, 0.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xf5b678, 2.6);
sun.position.set(-90, 40, -120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -SIZE / 2;
sun.shadow.camera.right = SIZE / 2;
sun.shadow.camera.top = SIZE / 2;
sun.shadow.camera.bottom = -SIZE / 2;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0006;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

// ---------------- sky --------------
// Warm gradient sky matched to the sand palette. (The downloaded dusk HDRI was
// too dark, so it is not used as the visible sky here.)
skyDome.visible = true;
window.__hdriLoaded = true;
window.__hdrEnvLoaded = false;

// ---------------- single pyramid (slightly right of centre) ----------------
const PYRAMIDS = [
  { x: 26, z: 0, base: 46, h: 30 },
];
const plateaus = PYRAMIDS.map(p => ({ x: p.x, z: p.z, r: p.base * 0.85 }));

function makeStoneTexture() {
  const size = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c79767';
  ctx.fillRect(0, 0, size, size);

  // weathering speckle
  for (let i = 0; i < 9000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(110,70,45,0.06)' : 'rgba(255,230,190,0.06)';
    ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
  }

  // stone block courses
  const rows = 14, rowH = size / rows;

  // per-block tonal variation (mosaic of slightly different limestone shades)
  const blockW = rowH * 2;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * rowH * 0.5;
    for (let x = -blockW + off; x < size + blockW; x += blockW) {
      ctx.fillStyle = Math.random() > 0.5
        ? `rgba(255,235,195,${0.03 + Math.random() * 0.06})`
        : `rgba(105,66,42,${0.03 + Math.random() * 0.06})`;
      ctx.fillRect(x, r * rowH, blockW, rowH);
    }
  }

  for (let r = 1; r < rows; r++) {
    const y = r * rowH + (Math.random() - 0.5) * 6;
    ctx.strokeStyle = 'rgba(105,66,42,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
    const offset = (r % 2) * rowH * 0.5;
    for (let x = offset; x < size; x += rowH * 2) {
      ctx.beginPath(); ctx.moveTo(x, y - rowH); ctx.lineTo(x, y); ctx.stroke();
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);            // one block pattern per pyramid face
  return tex;
}

const stoneTex = makeStoneTexture();
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, bumpMap: stoneTex, bumpScale: 0.03, roughness: 0.82, metalness: 0.02 });

for (const p of PYRAMIDS) {
  const radius = p.base * 0.707;                 // square base of side = base
  const geo = new THREE.ConeGeometry(radius, p.h, 4);
  const pyr = new THREE.Mesh(geo, stoneMat);
  pyr.position.set(p.x, PLATEAU + p.h / 2, p.z);
  pyr.rotation.y = Math.PI / 4;
  pyr.castShadow = pyr.receiveShadow = true;
  scene.add(pyr);
}

// ---------------- sand dunes ----------------
const duneH = (x, z) => (fbm(x / SIZE * 3 + 7, z / SIZE * 3 + 7, 4) - 0.5) * HEIGHT;

const duneGeo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);
duneGeo.rotateX(-Math.PI / 2);
{
  const pos = duneGeo.attributes.position;
  const colors = [];
  const sandLow = new THREE.Color(0xa76737);
  const sandHigh = new THREE.Color(0xd7a777);
  const warm = new THREE.Color(0xc8915c);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = duneH(x, z);

    // smooth plateau under each pyramid
    let t = 0;
    for (const p of plateaus) {
      const d = Math.hypot(x - p.x, z - p.z) / p.r;
      t = Math.max(t, 1 - smoothstep(0.7, 1.0, d));
    }
    h = h * (1 - t) + PLATEAU * t;
    pos.setY(i, h);

    const n = clamp01(h / HEIGHT + 0.5);
    const ripple = fbm(x * 0.35, z * 0.35, 3);
    const c = sandLow.clone().lerp(sandHigh, n);
    c.lerp(warm, ripple * 0.3);
    colors.push(c.r, c.g, c.b);
  }
  duneGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  duneGeo.computeVertexNormals();
}
function makeSandTextures() {
  const S = 512;
  // colour/detail map — kept near-neutral so the vertex colours dominate
  const c = document.createElement('canvas'); c.width = c.height = S;
  const cx = c.getContext('2d');
  cx.fillStyle = '#f7f3ea'; cx.fillRect(0, 0, S, S);
  for (let i = 0; i < 20000; i++) {
    const g = 200 + Math.random() * 55;
    cx.fillStyle = `rgba(${g | 0},${(g * 0.85) | 0},${(g * 0.7) | 0},${0.04 + Math.random() * 0.06})`;
    cx.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const mapTex = new THREE.CanvasTexture(c);
  mapTex.colorSpace = THREE.SRGBColorSpace;

  // bump map — grayscale grain + wind ripples
  const b = document.createElement('canvas'); b.width = b.height = S;
  const bx = b.getContext('2d');
  bx.fillStyle = '#808080'; bx.fillRect(0, 0, S, S);
  for (let i = 0; i < 16000; i++) {
    const g = 110 + Math.random() * 35;
    bx.fillStyle = `rgba(${g},${g},${g},0.5)`;
    bx.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  for (let y = 0; y < S; y += 8) {
    bx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    bx.fillRect(0, y, S, 2 + Math.random() * 5);
  }
  const bumpTex = new THREE.CanvasTexture(b);

  for (const t of [mapTex, bumpTex]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(70, 70);
  }
  return { map: mapTex, bump: bumpTex };
}

const sandTex = makeSandTextures();
const dunes = new THREE.Mesh(duneGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, map: sandTex.map, bumpMap: sandTex.bump, bumpScale: 0.04,
  roughness: 0.92, metalness: 0
}));
dunes.receiveShadow = true;
scene.add(dunes);



// ---------------- camera fly-through ----------------
const flyCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(26,   28, -120),
  new THREE.Vector3(116,  20, -80),
  new THREE.Vector3(146,  36, 0),
  new THREE.Vector3(106,  52, 70),
  new THREE.Vector3(26,   46, 115),
  new THREE.Vector3(-59,  30, 70),
  new THREE.Vector3(-94,  20, 0),
  new THREE.Vector3(-54,  24, -85),
], true);                    // closed → seamless infinite loop
const FLY_DURATION = 120;    // seconds per full revolution (slow + cinematic)

let autoFly = true;
controls.enabled = false;
let flyTime = 0;
let bank = 0;
let prevTan = null;

const btn = document.getElementById('toggleBtn');
btn.addEventListener('click', () => {
  autoFly = !autoFly;
  controls.enabled = !autoFly;
  btn.textContent = autoFly ? '🎥 Fly-through (auto)' : '🖱 Manual orbit';
});

// ---------------- loop ----------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (autoFly) {
    flyTime = (flyTime + dt) % FLY_DURATION;
    const u = flyTime / FLY_DURATION;
    flyCurve.getPoint(u, camera.position);

    // banking: tilt slightly into each turn, like a slow drone
    const tan = flyCurve.getTangentAt(u);
    if (prevTan) {
      const turn = tan.x * prevTan.z - tan.z * prevTan.x;   // yaw-rate proxy
      bank += (THREE.MathUtils.clamp(turn * 4, -0.12, 0.12) - bank) * Math.min(1, dt * 4);
    }
    prevTan = tan.clone();

    camera.lookAt(LOOK);
    camera.rotateZ(bank);       // apply roll after lookAt
  } else {
    controls.update();
  }

  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});

window.__built = true;
</script>
</body>
</html>
